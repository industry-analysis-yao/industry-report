name: Prepare Candidates for Codex Review (no publication)

on:
  schedule:
    # Collect at 19:35 JST. API output is a draft, never a public release.
    - cron: '35 10 * * *'
  workflow_dispatch:
    inputs:
      use_api:
        description: 'Use paid OpenRouter for a draft (never publishes)'
        type: boolean
        default: false

concurrency:
  group: industry-report-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Prepare isolated review workspace
        run: python scripts/prepare_review_workspace.py --output "$RUNNER_TEMP/industry-review"

      - name: Fetch news and patents
        env:
          NEWS_MAX_ITEMS_PER_QUERY: '60'
          NEWS_MAX_ENRICH_ARTICLES: '240'
          SPECIALTY_MAX_AGE_DAYS: '60'
          ACADEMIC_MAX_AGE_DAYS: '90'
          PATENT_MAX_AGE_DAYS: '365'
          MAX_PATENTS_TOTAL: '30'
        run: python scripts/fetch_news.py --data-dir "$RUNNER_TEMP/industry-review"

      - name: Generate optional API draft (Codex approval still required)
        id: digest
        env:
          OPENROUTER_API_KEY: ${{ (github.event_name == 'schedule' || inputs.use_api) && secrets.OPENROUTER_API_KEY || '' }}
          PATENT_MAX_AGE_DAYS: '365'
          DAILY_DIGEST_MIN: '15'
          DAILY_DIGEST_TARGET: '20'
          DAILY_DIGEST_MAX: '20'
          DAILY_DIGEST_LOOKBACK_DAYS: '3'
          DAILY_DIGEST_HISTORY_DAYS: '30'
          SPECIALTY_MAX_AGE_DAYS: '60'
          MAX_AI_ITEMS_PER_RUN: '80'
        run: python scripts/generate_dashboard.py --data-dir "$RUNNER_TEMP/industry-review"

      - name: Upload candidates for Codex review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-candidates
          path: ${{ runner.temp }}/industry-review
          retention-days: 7
          if-no-files-found: error
