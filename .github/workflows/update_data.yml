name: Update Dashboard Data

on:
  schedule:
    # Daily at 22:05 UTC = 07:05 JST (UTC+9)
    - cron: '5 22 * * *'
  workflow_dispatch:

concurrency:
  group: industry-report-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector tests
        run: python -m unittest discover -s tests -v

      - name: Fetch news and patents
        env:
          NEWS_MAX_ENRICH_ARTICLES: '50'
          SPECIALTY_MAX_AGE_DAYS: '60'
          ACADEMIC_MAX_AGE_DAYS: '90'
          PATENT_MAX_AGE_DAYS: '365'
          MAX_PATENTS_TOTAL: '30'
        run: python scripts/fetch_news.py

      - name: Generate summaries and highlights
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PATENT_MAX_AGE_DAYS: '365'
          DAILY_DIGEST_MIN: '15'
          DAILY_DIGEST_TARGET: '18'
          DAILY_DIGEST_MAX: '20'
          DAILY_DIGEST_LOOKBACK_DAYS: '14'
          SPECIALTY_MAX_AGE_DAYS: '60'
        run: python scripts/generate_dashboard.py

      - name: Cleanup data older than 90 days
        run: python scripts/cleanup_old_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news_data.json data/search_config.json data/dates_index.json data/permanent_vault.json data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update dashboard data [skip ci]"
            git push
          fi
